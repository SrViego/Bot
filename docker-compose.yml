# Morgana: bot Discord + Lavalink (musica)
# Uso:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down

services:
  lavalink:
    build:
      context: .
      dockerfile: Dockerfile.lavalink
    image: morgana-lavalink:local
    container_name: morgana-lavalink
    restart: unless-stopped
    environment:
      # mesma senha que o bot usa (LAVALINK_PASSWORD no .env); obrigatório
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?defina LAVALINK_PASSWORD no .env}
      # YouTube (ver docs/MUSICA-YOUTUBE.md) — tudo opcional, segredos só no .env
      YT_CIPHER_URL: ${YT_CIPHER_URL:-http://yt-cipher:8001}
      YT_CIPHER_PASSWORD: ${YT_CIPHER_PASSWORD:-}
      YOUTUBE_OAUTH_ENABLED: ${YOUTUBE_OAUTH_ENABLED:-false}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
      YOUTUBE_OAUTH_SKIP_INIT: ${YOUTUBE_OAUTH_SKIP_INIT:-false}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      # Só a config — plugins já estão na imagem (sem Permission denied)
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    networks:
      - morgana
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Servidor de cipher do YouTube (https://github.com/kikkia/yt-cipher).
  # Só na rede interna do compose (sem "ports:"), o Lavalink acessa por http://yt-cipher:8001
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: morgana-yt-cipher
    restart: unless-stopped
    environment:
      OVERRIDE_PLAYER_VARIANT: IAS
      API_TOKEN: ${YT_CIPHER_PASSWORD:-}
    networks:
      - morgana

  bot:
    build: .
    container_name: morgana-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_BACKEND: sqlite
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_SECURE: "false"
    volumes:
      # morgana.db (+ -wal/-shm) e backups/ vivem aqui — persistido no host
      - ./data:/app/data
    depends_on:
      lavalink:
        condition: service_healthy
    networks:
      - morgana

networks:
  morgana:
    driver: bridge
