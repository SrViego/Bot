server:
  port: 2333
  address: 0.0.0.0

lavalink:
  # Plugin YouTube vem embutido na imagem (Dockerfile.lavalink).
  # NÃO listar "dependency" aqui — o container tenta baixar e falha com Permission denied.
  plugins: []
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - ANDROID_MUSIC
      - WEB
      - MWEB
      - WEBEMBEDDED
      - TV
      - TVHTML5EMBEDDED
      - MEDIA_CONNECT
      - IOS

logging:
  level:
    root: INFO
    lavalink: INFO
